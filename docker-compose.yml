# =====================================================================
# Infraestrutura do NewSec Chat
#
# Sobe o que NÃO roda na Vercel: Redis (a fila), a Evolution API (o
# WhatsApp) e o worker (quem processa as filas).
#
# COMO USAR:
#   1. Copie .env.example para .env.local e preencha
#   2. docker compose --env-file .env.local up -d --build
#   3. docker compose logs -f trabalhador
#
# O `--env-file .env.local` é obrigatório: o Docker Compose só lê sozinho
# um arquivo chamado `.env`. Sem a opção, os containers sobem com todas as
# variáveis vazias — a Evolution não acha o banco e o worker não acha o
# Supabase, com erros que não apontam para a causa.
#
# A aplicação web (Next.js) NÃO está aqui: ela roda na Vercel, ou local
# com `npm run dev`. O que está aqui precisa de um servidor ligado o
# tempo todo — é por isso que a divisão existe.
# =====================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: newsecchat-redis
    restart: unless-stopped
    # A porta fica exposta só em 127.0.0.1: um Redis aberto para a
    # internet é invadido em questão de horas.
    ports:
      - '127.0.0.1:6379:6379'
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - dados-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------------
  # Evolution API — a ponte com o WhatsApp.
  #
  # Guarda os dados no PRÓPRIO Postgres do Supabase, num schema separado
  # (`evolution`). Assim não existe um segundo banco para fazer backup e
  # o dono não precisa administrar mais nada.
  # -------------------------------------------------------------------
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: newsecchat-evolution
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      SERVER_URL: ${EVOLUTION_API_URL}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_TYPE: apikey

      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      # `?schema=evolution` põe as tabelas da Evolution num schema próprio.
      # Sem isso elas nasceriam no `public`, que a Data API do Supabase
      # expõe para a chave anônima — e, sem RLS, as sessões de WhatsApp
      # ficariam legíveis pela internet. Por isso a SUPABASE_DB_URL do
      # .env.local vai SEM parâmetros no final.
      DATABASE_CONNECTION_URI: ${SUPABASE_DB_URL}?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution

      DATABASE_SAVE_DATA_INSTANCE: 'true'
      # 'true' de propósito, ao contrário das quatro linhas abaixo: é o que
      # faz /chat/getBase64FromMediaMessage achar a mensagem. Essa rota
      # procura a mensagem numa tabela própria da Evolution (repository.
      # message, no código-fonte dela) antes de devolver a mídia — com esta
      # linha em 'false', a busca sempre vinha vazia e a rota respondia
      # "Message not found" para TODO áudio, imagem ou documento recebido.
      # É o preço de a transcrição funcionar: a mensagem fica duplicada no
      # schema `evolution` por um tempo, além de estar em `mensagens`, na
      # nossa aplicação. Sem duplicar aqui, não tem como decodificar mídia
      # de forma assíncrona — o WhatsApp cifra o arquivo, e só quem acabou
      # de recebê-lo (a Evolution) consegue decifrar.
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'true'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'

      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: 'false'

      # O webhook é configurado por canal pela própria aplicação, com o
      # segredo de cada um. Nada global aqui.
      WEBHOOK_GLOBAL_ENABLED: 'false'

      QRCODE_LIMIT: '10'
      LOG_LEVEL: ERROR
      DEL_INSTANCE: 'false'
    volumes:
      - instancias-evolution:/evolution/instances
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # -------------------------------------------------------------------
  # Worker — consome as filas.
  #
  # Sem ele, mensagem recebida fica gravada e parada: a IA não responde,
  # o envio não sai e a campanha não anda.
  # -------------------------------------------------------------------
  trabalhador:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: newsecchat-trabalhador
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NEXT_PUBLIC_URL_APLICACAO: ${NEXT_PUBLIC_URL_APLICACAO}
      # Redis de dentro desta máquina. A Vercel não fala com ele: grava o
      # trabalho no banco, e a varredura rápida deste worker o busca.
      REDIS_URL: redis://redis:6379
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      PROVEDOR_IA: ${PROVEDOR_IA:-OPENAI}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODELO_CONVERSA: ${OPENAI_MODELO_CONVERSA:-gpt-4o-mini}
      OPENAI_MODELO_ANALISE: ${OPENAI_MODELO_ANALISE:-gpt-4o}
      OPENAI_MODELO_TRANSCRICAO: ${OPENAI_MODELO_TRANSCRICAO:-whisper-1}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      NIVEL_LOG: ${NIVEL_LOG:-info}
      # De quantos em quantos segundos o worker procura trabalho novo no
      # banco. É o atraso máximo entre a mensagem chegar e a IA começar, e
      # entre o atendente enviar e a mensagem sair.
      VARREDURA_RAPIDA_SEGUNDOS: ${VARREDURA_RAPIDA_SEGUNDOS:-1}

  # -------------------------------------------------------------------
  # Caddy — põe a Evolution na internet com HTTPS.
  #
  # Por que existe: a aplicação na Vercel chama a Evolution para criar
  # canal e gerar o QR Code. A porta 8080 fica publicada só em
  # 127.0.0.1, então de fora ninguém a alcança — e expor 8080 aberta
  # seria pior: quem controla a Evolution manda mensagem em nome do
  # número. O Caddy resolve os dois lados: fecha a porta e publica um
  # endereço com certificado, atrás da chave da Evolution.
  #
  # O certificado é emitido e renovado sozinho pela Let's Encrypt. Para
  # isso o domínio de EVOLUTION_API_URL precisa estar apontando para o
  # IP desta máquina ANTES de subir, e as portas 80 e 443 abertas.
  # -------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: newsecchat-caddy
    restart: unless-stopped
    depends_on:
      - evolution
    ports:
      - '80:80'
      - '443:443'
    environment:
      # O Caddyfile usa este valor como endereço do site. Precisa ser
      # `https://dominio`, sem barra no final — é o mesmo valor que a
      # Evolution recebe em SERVER_URL e que vai na Vercel.
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      # Os certificados vivem aqui. Sem volume, cada recriação do
      # container pediria certificado novo e bateria no limite semanal
      # da Let's Encrypt.
      - dados-caddy:/data
      - config-caddy:/config

volumes:
  dados-redis:
  instancias-evolution:
  dados-caddy:
  config-caddy:
