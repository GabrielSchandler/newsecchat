# =====================================================================
# Infraestrutura do NewSec Chat
#
# Sobe o que NÃO roda na Vercel: Redis (a fila), a Evolution API (o
# WhatsApp) e o worker (quem processa as filas).
#
# COMO USAR:
#   1. Copie .env.example para .env.local e preencha
#   2. docker compose up -d
#   3. docker compose logs -f trabalhador
#
# A aplicação web (Next.js) NÃO está aqui: ela roda na Vercel, ou local
# com `npm run dev`. O que está aqui precisa de um servidor ligado o
# tempo todo — é por isso que a divisão existe.
# =====================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: newsecchat-redis
    restart: unless-stopped
    # A porta fica exposta só em 127.0.0.1: um Redis aberto para a
    # internet é invadido em questão de horas.
    ports:
      - '127.0.0.1:6379:6379'
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - dados-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------------
  # Evolution API — a ponte com o WhatsApp.
  #
  # Guarda os dados no PRÓPRIO Postgres do Supabase, num schema separado
  # (`evolution`). Assim não existe um segundo banco para fazer backup e
  # o dono não precisa administrar mais nada.
  # -------------------------------------------------------------------
  evolution:
    image: atendai/evolution-api:v2.1.1
    container_name: newsecchat-evolution
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      SERVER_URL: ${EVOLUTION_API_URL}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_TYPE: apikey

      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      # `?schema=evolution` põe as tabelas da Evolution num schema próprio.
      # Sem isso elas nasceriam no `public`, que a Data API do Supabase
      # expõe para a chave anônima — e, sem RLS, as sessões de WhatsApp
      # ficariam legíveis pela internet. Por isso a SUPABASE_DB_URL do
      # .env.local vai SEM parâmetros no final.
      DATABASE_CONNECTION_URI: ${SUPABASE_DB_URL}?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution

      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'

      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: 'false'

      # O webhook é configurado por canal pela própria aplicação, com o
      # segredo de cada um. Nada global aqui.
      WEBHOOK_GLOBAL_ENABLED: 'false'

      QRCODE_LIMIT: '10'
      LOG_LEVEL: ERROR
      DEL_INSTANCE: 'false'
    volumes:
      - instancias-evolution:/evolution/instances
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # -------------------------------------------------------------------
  # Worker — consome as filas.
  #
  # Sem ele, mensagem recebida fica gravada e parada: a IA não responde,
  # o envio não sai e a campanha não anda.
  # -------------------------------------------------------------------
  trabalhador:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: newsecchat-trabalhador
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NEXT_PUBLIC_URL_APLICACAO: ${NEXT_PUBLIC_URL_APLICACAO}
      REDIS_URL: redis://redis:6379
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      PROVEDOR_IA: ${PROVEDOR_IA:-OPENAI}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODELO_CONVERSA: ${OPENAI_MODELO_CONVERSA:-gpt-4o-mini}
      OPENAI_MODELO_ANALISE: ${OPENAI_MODELO_ANALISE:-gpt-4o}
      OPENAI_MODELO_TRANSCRICAO: ${OPENAI_MODELO_TRANSCRICAO:-whisper-1}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      NIVEL_LOG: ${NIVEL_LOG:-info}

volumes:
  dados-redis:
  instancias-evolution:
